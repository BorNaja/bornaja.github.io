      <path d="M80 0H0V80" fill="none" stroke="#2f3549" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#1a1b26"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1280" cy="220" r="260" fill="#24283b"/>
  <circle cx="260" cy="700" r="200" fill="#24283b"/>
